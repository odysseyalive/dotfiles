# YADRLite - SSH defaults for links that jitter.
#
# Included from ~/.ssh/config. Contains no hosts, credentials, or key paths --
# only generic `Host *` defaults -- so it is safe to keep in a public repo while
# your real ~/.ssh/config stays private and untracked.
#
# IMPORTANT -- ordering: ssh_config uses the FIRST value it obtains for each
# parameter, so this file must be Included at the very END of ~/.ssh/config.
# Anything you set inside a specific `Host` block above the Include keeps
# winning; these are only the fallbacks for settings you have not pinned.
#
# IMPORTANT -- the Include must be preceded by a bare `Host *` line:
#
#     Host *
#     Include ~/.yadrlite/ssh/resilience.conf
#
# An Include inherits whatever block it appears in. Appended after the last
# `Host myserver` block, a bare Include would silently apply to that one host
# instead of to everything. `Host *` resets the match to all hosts. Verify with
# `ssh -G <somehost> | grep controlmaster` -- it should print "auto".
#
# The problem these settings address is a congested Wi-Fi link, where frames
# are retried rather than dropped. TCP sees a latency spike, not a loss, so the
# session does not die -- it hangs, then unfreezes seconds later. Keystrokes
# arrive in bursts and a session that truly died can sit there looking alive.

Host *

    # --- detect a dead peer quickly -------------------------------------
    # Probe every 20s and give up after 3 unanswered probes, reclaiming a
    # genuinely dead session in ~60s instead of OpenSSH's default 3 minutes of
    # silence. These probes travel inside the SSH channel, so unlike
    # TCPKeepAlive they cannot be spoofed, and they keep NAT/firewall state
    # alive on idle sessions.
    #
    # CountMax stays at the default 3 deliberately. Any Host block above that
    # pins its own ServerAliveInterval (a common habit -- e.g. 60) keeps that
    # value, and raising CountMax here would *lengthen* those hosts' detection
    # time (60x4=240s) rather than shorten it. At 3, no existing host gets
    # worse and every unpinned host gets 60s.
    ServerAliveInterval 20
    ServerAliveCountMax 3

    # TCP-level keepalive as well: this is what notices the *other* failure
    # mode, where the route dies rather than the daemon.
    TCPKeepAlive yes

    # --- stop paying for the handshake more than once -------------------
    # Every new ssh/scp/rsync to a host you are already connected to normally
    # repeats a full TCP + key exchange + auth round trip. On a link with
    # 60ms latency spikes that handshake is where "ssh feels slow" comes
    # from. Multiplexing reuses the existing connection instead, making
    # subsequent sessions open effectively instantly -- which matters most
    # for ProxyJump/ProxyCommand hosts, where the bastion hop is paid twice.
    #
    # %C is a hash of (host, port, user, proxy), keeping the socket path
    # short enough for the ~104-character UNIX socket limit.
    ControlMaster auto
    ControlPath ~/.ssh/sockets/%C
    ControlPersist 10m

    # --- misc -----------------------------------------------------------
    # Reuse the agent's keys rather than re-reading key files per connection.
    AddKeysToAgent yes

    # Fail fast instead of hanging on an unreachable host.
    ConnectTimeout 10

# Note on genuinely bad links: multiplexing and keepalives make SSH *recover*
# well, but SSH is still TCP -- a stalled segment stalls your typing. If you
# routinely work over congested Wi-Fi or mobile tethering, `mosh` replaces the
# transport with UDP and predicts local echo, so typing stays responsive
# through the spikes and survives suspend/resume and IP changes. It needs a
# UDP port range (60000-61000) open to the server.
